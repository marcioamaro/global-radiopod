name: Android regression
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36.1' 'build-tools;36.0.0'
      - run: python3 scripts/check_project.py
      - run: chmod +x gradlew
      - run: >-
          ./gradlew :app:testDebugUnitTest
          --tests com.example.data.RadioDatabaseMigrationTest
          --tests com.example.data.UnifiedRadioCatalogTest
          --tests com.example.data.RestoreFailureRecoveryTest
          --tests com.example.data.MediaBackupRoundTripTest
          --tests com.example.util.BackupPasswordTest
          --tests com.example.util.MediaIdentitySecurityTest
          --tests com.example.ui.BackupPasswordDialogTest
          --tests com.example.ui.FeatureAccessibilityTest
          --tests com.example.data.CatalogUpdatesTest
          --tests com.example.data.CatalogGeographyTest
          --tests com.example.data.MediaFileRecoveryTest
          --tests com.example.data.ResumableTransferTest
          --tests com.example.data.DownloadQueueRecoveryTest
          --tests com.example.data.DiagnosticsTest
          --tests com.example.data.PodcastLibraryToolsTest
          --tests com.example.data.LibrarySuggestionsTest
          --tests com.example.data.DataUsagePolicyTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: app/build/reports/tests/testDebugUnitTest
